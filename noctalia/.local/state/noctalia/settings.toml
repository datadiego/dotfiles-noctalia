config_version = 13

[bar.default]
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 800.0
    cy = 718.0
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1600.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
password_style = "random"
polkit_agent = true

[templates.nvim-base16]
input_path = "~/.config/nvim/lua/matugen-template.lua"
output_path = "~/.config/nvim/lua/matugen.lua"
post_hook = "pkill -SIGUSR1 nvim"

[theme]
builtin = "Gruvbox"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "niri", "starship" ]
    community_ids = [ "neovim" ]

[wallpaper]
directory = "~/Imágenes/wallpapers"

    [wallpaper.default]
    path = "~/Imágenes/wallpapers/gruvbox/wallpapers/minimalistic/ALLqk82.png"

    [wallpaper.last]
    path = "~/Imágenes/wallpapers/gruvbox/wallpapers/minimalistic/ALLqk82.png"

    [wallpaper.monitors.eDP-1]
    path = "~/Imágenes/wallpapers/gruvbox/wallpapers/minimalistic/ALLqk82.png"

    [[wallpaper.favorite]]
    path = "~/Imágenes/wallpapers/gruvbox/wallpapers/renders/1.jpg"
    theme_mode = "auto"