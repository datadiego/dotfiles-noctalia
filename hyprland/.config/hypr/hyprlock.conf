background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.5
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +\%H:\%M)"
    font_size = 96
    font_family = JetBrains Mono
    color = rgb(ffffff)
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +\%A, \%d de \%B)"
    font_size = 24
    font_family = JetBrains Mono
    color = rgb(ffffff)
    position = 0, 180
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(ffffff)
    inner_color = rgb(000000)
    font_color = rgb(ffffff)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff99">Contrasena...</span>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}
